identity:
  name: generate_video
  author: muapi
  label:
    en_US: Generate Video

description:
  human:
    en_US: Generate videos from a text prompt using MuAPI
  llm: Generate a video from a text description using AI video generation models via MuAPI

parameters:
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
    human_description:
      en_US: Text prompt describing the video to generate
    llm_description: Text prompt describing the video to generate

  - name: model
    type: string
    required: false
    form: form
    label:
      en_US: Model
    human_description:
      en_US: The model to use for video generation (e.g. kling-master)
    llm_description: The model to use for video generation
    default: kling-master

  - name: duration
    type: number
    required: false
    form: form
    label:
      en_US: Duration
    human_description:
      en_US: Duration of the video in seconds
    llm_description: Duration of the generated video in seconds
    default: 5

  - name: aspect_ratio
    type: string
    required: false
    form: form
    label:
      en_US: Aspect Ratio
    human_description:
      en_US: Aspect ratio of the video (e.g. 16:9, 9:16, 1:1)
    llm_description: Aspect ratio of the generated video
    default: "16:9"

extra:
  python:
    source: tools/generate_video.py
