identity:
  name: image_to_video
  author: muapi
  label:
    en_US: Image to Video

description:
  human:
    en_US: Convert a static image into a video using MuAPI
  llm: Animate a static image into a video with a text prompt using AI video generation models via MuAPI

parameters:
  - name: image
    type: string
    required: true
    form: llm
    label:
      en_US: Image URL
    human_description:
      en_US: URL of the source image to animate
    llm_description: URL of the source image to convert into a video

  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
    human_description:
      en_US: Text prompt describing how the image should be animated
    llm_description: Text prompt describing the desired animation or motion for the image

  - name: model
    type: string
    required: false
    form: form
    label:
      en_US: Model
    human_description:
      en_US: The model to use for image-to-video generation (e.g. kling-std)
    llm_description: The model to use for image-to-video generation
    default: kling-std

  - name: duration
    type: number
    required: false
    form: form
    label:
      en_US: Duration
    human_description:
      en_US: Duration of the video in seconds
    llm_description: Duration of the generated video in seconds
    default: 5

  - name: aspect_ratio
    type: string
    required: false
    form: form
    label:
      en_US: Aspect Ratio
    human_description:
      en_US: Aspect ratio of the video (e.g. 16:9, 9:16, 1:1)
    llm_description: Aspect ratio of the generated video
    default: "16:9"

extra:
  python:
    source: tools/image_to_video.py
